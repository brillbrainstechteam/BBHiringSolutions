# After every push to the live branch, update the server (runs deploy/bbhs-deploy.sh there).
# Needs one repository secret: VPS_DEPLOY_KEY — the private key whose public half is in the
# server's authorized_keys, locked to the deploy command (see docs/DEPLOY.md, "Automatic deploy").
name: Deploy to server

on:
  push:
    branches: [feat/ui-refresh, main]
  workflow_dispatch:

concurrency: deploy-live

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run the deploy on the server
        env:
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # The server's own host key (from /etc/ssh/ssh_host_ed25519_key.pub), so no lookup is needed.
          echo '187.127.176.187 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBKFbiLFl1UwFScp0b6rQULGzL2dc3gzTWJGfAk9tL76' >> ~/.ssh/known_hosts
          # The key can only run bbhs-deploy on the server, whatever is asked here.
          # A dropped connection from GitHub's side is tried again (3 times, 15 s apart).
          for try in 1 2 3; do
            ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -i ~/.ssh/deploy_key root@187.127.176.187 deploy && exit 0
            code=$?; [ "$code" -ne 255 ] && exit "$code"   # 255 = could not connect; anything else is the deploy's own answer
            echo "Could not reach the server (try $try of 3)"; sleep 15
          done
          # The server also checks GitHub every 2 minutes (bbhs-deploy.timer), so the push still goes live.
          echo "::warning::Could not reach the server from GitHub; it picks up this push by itself within 2 minutes."
          exit 0
